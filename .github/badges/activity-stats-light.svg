<svg xmlns="http://www.w3.org/2000/svg" width="415" height="168" viewBox="0 0 415 168" role="img" aria-label="GitHub stats, all time, including private">
  <defs>
    
    <linearGradient id="pulse-st-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#b45309" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#b45309" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-st-l"><rect x="0" y="0" width="415" height="168" rx="10" ry="10"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="414" height="167" rx="10" ry="10" fill="none" stroke="#d0d7de"/>

  <g clip-path="url(#clip-st-l)">
    <line x1="0" y1="28" x2="415" y2="28" stroke="#eaecef" stroke-width="1"/>
    <rect x="-174" y="27" width="174" height="1" fill="url(#pulse-st-l)">
    <animate attributeName="x" from="-174" to="415" dur="7s" repeatCount="indefinite"/>
  </rect>
  </g>

  <g font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="14" y="20" font-size="13" font-weight="700" fill="#0b1220" letter-spacing="-0.1">Stats</text>
    <text x="401" y="20" text-anchor="end" font-size="11" font-weight="600" fill="#656d76" letter-spacing="1.2">all time, including private</text>
  </g>

  <g><line x1="207.5" y1="42" x2="207.5" y2="154" stroke="#eaecef" stroke-width="1"/><line x1="14" y1="112" x2="401" y2="112" stroke="#eaecef" stroke-width="1"/></g>
  <g font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, sans-serif">
      <g text-anchor="middle">
        <text x="110.8" y="78" font-size="18" font-weight="800" fill="#0b1220" letter-spacing="-0.4">4,492</text>
        <text x="110.8" y="91" font-size="9" font-weight="700" fill="#656d76" letter-spacing="1.8">COMMITS</text>
      </g>
      <g text-anchor="middle">
        <text x="304.3" y="78" font-size="18" font-weight="800" fill="#0b1220" letter-spacing="-0.4">232</text>
        <text x="304.3" y="91" font-size="9" font-weight="700" fill="#656d76" letter-spacing="1.8">PULL REQUESTS</text>
      </g>
      <g text-anchor="middle">
        <text x="110.8" y="138" font-size="18" font-weight="800" fill="#0b1220" letter-spacing="-0.4">45</text>
        <text x="110.8" y="151" font-size="9" font-weight="700" fill="#656d76" letter-spacing="1.8">STARS</text>
      </g>
      <g text-anchor="middle">
        <text x="304.3" y="138" font-size="18" font-weight="800" fill="#0b1220" letter-spacing="-0.4">23</text>
        <text x="304.3" y="151" font-size="9" font-weight="700" fill="#656d76" letter-spacing="1.8">LANGUAGES</text>
      </g></g>
</svg>
