<svg xmlns="http://www.w3.org/2000/svg" width="415" height="178" viewBox="0 0 415 178" role="img" aria-label="YouTube Downloader">
  <defs>
    <linearGradient id="sheen-card-youtube-downloader-d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-card-youtube-downloader-d"><rect x="0" y="0" width="415" height="178" rx="10" ry="10"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="414" height="177" rx="10" ry="10" fill="none" stroke="#30363d"/>

  <g clip-path="url(#clip-card-youtube-downloader-d)">
    <rect x="-180" y="0" width="180" height="1.5" fill="url(#sheen-card-youtube-downloader-d)">
      <animate attributeName="x" from="-180" to="415" dur="12s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <image href="data:image/svg+xml;base64," x="14" y="14" width="40" height="40"/>

  <g font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="66" y="31" font-size="15" font-weight="700" fill="#e6e9f1" letter-spacing="-0.2">YouTube Downloader</text>
    <text x="66" y="48" font-size="11" font-weight="600" fill="#7d8590" letter-spacing="0.3">TypeScript</text>
    <text x="14" y="78" font-size="12.5" fill="#adbac7">Desktop YouTube downloader built on yt-dlp and FFmpeg.</text>
  </g>

  <line x1="14" y1="127" x2="401" y2="127" stroke="#1c222c" stroke-width="1"/>
  <g font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="62.4" y="150" text-anchor="middle" font-size="13.5" font-weight="800" fill="#e6e9f1" letter-spacing="-0.2">v1.4.23</text>
    <text x="62.4" y="164" text-anchor="middle" font-size="9" font-weight="700" fill="#7d8590" letter-spacing="1.4">RELEASE</text>
    <text x="159.1" y="150" text-anchor="middle" font-size="13.5" font-weight="800" fill="#e6e9f1" letter-spacing="-0.2">2,132</text>
    <text x="159.1" y="164" text-anchor="middle" font-size="9" font-weight="700" fill="#7d8590" letter-spacing="1.4">DOWNLOADS</text>
    <line x1="110.8" y1="137" x2="110.8" y2="168" stroke="#1c222c" stroke-width="1"/>
    <text x="255.9" y="150" text-anchor="middle" font-size="13.5" font-weight="800" fill="#e6e9f1" letter-spacing="-0.2">passing</text>
    <text x="255.9" y="164" text-anchor="middle" font-size="9" font-weight="700" fill="#7d8590" letter-spacing="1.4">CI</text>
    <line x1="207.5" y1="137" x2="207.5" y2="168" stroke="#1c222c" stroke-width="1"/>
    <text x="352.6" y="150" text-anchor="middle" font-size="13.5" font-weight="800" fill="#e6e9f1" letter-spacing="-0.2">2 days ago</text>
    <text x="352.6" y="164" text-anchor="middle" font-size="9" font-weight="700" fill="#7d8590" letter-spacing="1.4">UPDATED</text>
    <line x1="304.3" y1="137" x2="304.3" y2="168" stroke="#1c222c" stroke-width="1"/>
  </g>
</svg>
