  <g font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="66" y="31" font-size="15" font-weight="700" fill="#e6e9f1" letter-spacing="-0.2">zerolith</text>
    <text x="66" y="48" font-size="11" font-weight="600" fill="#7d8590" letter-spacing="0.3">TypeScript</text>
    <text x="14" y="78" font-size="12.5" fill="#adbac7">Full framework, zero guesswork. Routing, forms, rendering, and</text>
    <text x="14" y="95" font-size="12.5" fill="#adbac7">i18n with clear patterns for you and your agent; buildless or</text>
    <text x="14" y="112" font-size="12.5" fill="#adbac7">bundled, for any backend.</text>
  </g>

  <line x1="14" y1="127" x2="401" y2="127" stroke="#1c222c" stroke-width="1"/>
  <g font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="62.4" y="150" text-anchor="middle" font-size="12" font-weight="800" fill="#e6e9f1" letter-spacing="-0.2">v0.1.0-alpha.3</text>
    <text x="62.4" y="164" text-anchor="middle" font-size="9" font-weight="700" fill="#7d8590" letter-spacing="1.4">NPM</text>
    <text x="159.1" y="150" text-anchor="middle" font-size="12" font-weight="800" fill="#e6e9f1" letter-spacing="-0.2">v0.1.0-alpha.3</text>
    <text x="159.1" y="164" text-anchor="middle" font-size="9" font-weight="700" fill="#7d8590" letter-spacing="1.4">CRATES.IO</text>
    <line x1="110.8" y1="137" x2="110.8" y2="168" stroke="#1c222c" stroke-width="1"/>
    <text x="255.9" y="150" text-anchor="middle" font-size="13.5" font-weight="800" fill="#7d8590" letter-spacing="-0.2">running</text>
    <text x="255.9" y="164" text-anchor="middle" font-size="9" font-weight="700" fill="#7d8590" letter-spacing="1.4">CI</text>
    <line x1="207.5" y1="137" x2="207.5" y2="168" stroke="#1c222c" stroke-width="1"/>
    <text x="352.6" y="150" text-anchor="middle" font-size="13.5" font-weight="800" fill="#e6e9f1" letter-spacing="-0.2">today</text>
    <text x="352.6" y="164" text-anchor="middle" font-size="9" font-weight="700" fill="#7d8590" letter-spacing="1.4">UPDATED</text>
