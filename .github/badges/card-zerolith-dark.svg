<svg xmlns="http://www.w3.org/2000/svg" width="415" height="178" viewBox="0 0 415 178" role="img" aria-label="zerolith">
  <defs>
    <linearGradient id="sheen-card-zerolith-d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-card-zerolith-d"><rect x="0" y="0" width="415" height="178" rx="10" ry="10"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="414" height="177" rx="10" ry="10" fill="none" stroke="#30363d"/>

  <g clip-path="url(#clip-card-zerolith-d)">
    <rect x="-180" y="0" width="180" height="1.5" fill="url(#sheen-card-zerolith-d)">
      <animate attributeName="x" from="-180" to="415" dur="12s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <image href="data:image/svg+xml;base64," x="14" y="14" width="40" height="40"/>
  <rect x="346" y="16" width="55" height="18" rx="9" fill="#ffffff"/>
